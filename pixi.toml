[workspace]
name = "openaerostruct"
version = "3.0.0.dev0"
description = "Pixi environment for OpenAeroStruct on OpenMDAO 4 (om4)."
channels = ["conda-forge"]
# macos = "15.0" raises the osx-arm64 baseline pixi assumes for PyPI wheel
# compatibility (default is 11.0) so the resolver picks unopy's
# macosx_15_0_arm64 wheel instead of falling back to its sdist -- a wheel's
# macOS tag is a minimum deployment target, so this can only add eligible
# wheels, never remove ones that matched at 11.0.
platforms = [{ platform = "osx-arm64", macos = "15.0" }, "linux-64", "win-64"]

[dependencies]
python = ">=3.12"
pip = "*"
numpy = "*"
scipy = "*"
networkx = "*"
pydantic = ">=2,<3"
pydantic-core = "*"
rich = ">=15.0.0,<16"
structlog = ">=24.0.0"
matplotlib = "*"

[target.win-64.dependencies]
# Same pin as om4/dymos4: conda-forge MKL 2026.1 and OpenBLAS 0.3.34 both crash
# on win-64 (missing libiomp5md symbols / AVX2 dgemm access violation).
libblas = { version = "*", build = "*openblas" }
libopenblas = { version = "<0.3.34", build = "pthreads*" }

[feature.dev.dependencies]
ruff = ">=0.15.7,<0.16"
testflo = "*"
parameterized = "*"
# OM3, only for cross-checking ported components against the original numerics.
openmdao = "*"
pre-commit = ">=4.0,<5"

[feature.opt.dependencies]
pyoptsparse = ">=2.14.0"

# pyoptsparse ships the pyIPOPT wrapper unconditionally, but it imports cyipopt,
# which is a separate package -- without this, OPT('IPOPT') raises ModuleNotFoundError
# and list_optimizers() silently omits IPOPT.
#
# *nix only: on win-64, cyipopt's dependency chain (ipopt -> mumps-seq ->
# libflang, which bundles a fixed openmp==5.0.0) conflicts with this repo's
# win-64 libopenblas/libblas pin below (added for an unrelated MKL/OpenBLAS
# crash workaround), so the solver can't satisfy both at once.
[feature.opt.target.linux-64.dependencies]
cyipopt = "*"

[feature.opt.target.osx-arm64.dependencies]
cyipopt = "*"

# pyoptsparse's Uno wrapper imports unopy, which is published on PyPI only (no
# conda-forge build). Kept as its own feature so environments that don't need
# it (e.g. a future docs env) don't pull a solver they never run.
#
# unopy ships prebuilt wheels; llvm-openmp/pkg-config are only needed as a
# fallback if the resolver ever falls back to building its sdist. *nix only,
# for the same win-64 openmp pin conflict as cyipopt above.
#
# Pinned <0.4.15: 0.4.15 dropped loose_primal_tolerance/loose_dual_tolerance/
# loose_tolerance_iteration_threshold, which pyoptsparse's pyUno still sets
# unconditionally, raising KeyError('loose_primal_tolerance does not exist')
# on every run. Fixed upstream (mdolab/pyoptsparse#501) but not yet in a
# pyoptsparse release. Unpin once a pyoptsparse release includes that fix.
[feature.uno.target.linux-64.dependencies]
llvm-openmp = "*"
pkg-config = "*"

[feature.uno.target.osx-arm64.dependencies]
llvm-openmp = "*"
pkg-config = "*"

[feature.uno.target.linux-64.pypi-dependencies]
unopy = "<0.4.15"

[feature.uno.target.osx-arm64.pypi-dependencies]
unopy = "<0.4.15"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.petsc.target.linux-64.dependencies]
# For om4's PETScDirectSolver/PETScKrylov; petsc4py needs an MPI build even for
# serial use, so pull in the same MPI stack as om4's own "mpi" feature.
# No conda-forge petsc build for win-64, so this feature is *nix-only.
openmpi = "*"
mpi4py = "*"
petsc = "*"
petsc4py = "*"

[feature.petsc.target.osx-arm64.dependencies]
openmpi = "*"
mpi4py = "*"
petsc = "*"
petsc4py = "*"

[pypi-dependencies]
# OpenAeroStruct itself, installed editable from this repo.
openaerostruct = { path = ".", editable = true }
# OpenMDAO 4 framework, installed editable from the sibling checkout.
om4 = { path = "../om4.git", editable = true }
# om4 dependencies not on conda-forge (or pinned there differently)
nicegui = "*"
jax = "*"
jaxlib = "*"
asdex = "*"

[environments]
default = { features = ["py313", "dev", "opt", "uno", "petsc"] }
py312 = { features = ["py312", "dev", "opt", "uno", "petsc"] }

[activation]
env = { JAX_PLATFORMS = "cpu", PYTHONUTF8 = "1" }

[tasks]
test = "testflo tests -n 1"
lint = "ruff check openaerostruct tests"
format = "ruff format openaerostruct tests"
